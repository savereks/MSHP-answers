{% extends 'base.html' %}

{% block content %}
<div class="form-page-wrapper">
  <div class="form-card">
    <h2>Регистрация</h2>
    <p>Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn-register">Зарегистрироваться</button>
    </form>
  </div>
</div>
{% endblock %}
