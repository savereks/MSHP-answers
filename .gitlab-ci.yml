stages:
  - test
  - docs
  - pages

variables:
  PYTHON_VERSION: "3.11"
  DJANGO_SETTINGS_MODULE: "testdjango.settings"

cache:
  paths:
    - venv/
    - .cache/pip
    - docs/_build/

# Шаблон для Python
.python_setup: &python_setup
  before_script:
    - apt-get update -qq && apt-get install -y -qq graphviz
    - python -m venv venv
    - source venv/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements.txt

test:
  stage: test
  image: python:${PYTHON_VERSION}-slim
  <<: *python_setup
  script:
    # Запуск тестов с покрытием
    - pip install coverage
    - coverage run --source='core' manage.py test core --verbosity=2
    - coverage report -m
    - coverage xml -o coverage.xml
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
      - htmlcov/
    expire_in: 1 week
  coverage: '/TOTAL.*\s+(\d+%)$/'
  only:
    - main
    - develop
    - merge_requests

# ========== 2. СОЗДАНИЕ ТЕСТОВОЙ ДОКУМЕНТАЦИИ ==========
docs-build:
  stage: docs
  image: python:${PYTHON_VERSION}-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq make graphviz
    - pip install --upgrade pip
    - pip install -r docs/requirements.txt
  script:
    - cd docs
    - make clean
    - make html
  artifacts:
    paths:
      - docs/_build/html/
      - docs/_build/latex/*.pdf
    expire_in: 1 week
  only:
    - main
    - develop

# ========== 3. ПУБЛИКАЦИЯ НА GITLAB PAGES ==========
pages:
  stage: pages
  image: alpine:latest
  needs:
    - docs-build
  script:
    - mkdir -p public
    - cp -r docs/_build/html/* public/ || true
    - echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0; url=index.html"></head><body></body></html>' > public/index.html
  artifacts:
    paths:
      - public
  only:
    - main